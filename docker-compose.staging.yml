services:
  web:
    image: ghcr.io/ultra-teknologi-indonesia/cilupbah-frontend:latest
    container_name: cilupbah-fe-staging
    ports:
      - "6000:6000"
    environment:
      - NODE_ENV=production
      - PORT=6000
      # URL backend staging — dibaca di runtime (bukan di-bake ke image),
      # lihat catatan di Dockerfile.staging.
      - API_URL=https://dev-backend-app.ultra-fit.id
    restart: unless-stopped
