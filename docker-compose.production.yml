services:
  web:
    # Tag di sini di-pin otomatis oleh deploy-production.yml (sed ke versi
    # yang dipilih saat workflow_dispatch) — jangan diandalkan sebagai
    # sumber kebenaran versi yang sedang jalan, cek `docker ps` di VPS.
    image: ghcr.io/ultra-teknologi-indonesia/cilupbah-frontend:latest
    container_name: cilupbah-fe-production
    ports:
      - "6001:6001"
    environment:
      - NODE_ENV=production
      - PORT=6001
      # URL backend production — dibaca di runtime (bukan di-bake ke image),
      # lihat catatan di Dockerfile.
      - API_URL=https://be-superapp.ultra-fit.id/
    restart: unless-stopped
