name: CI/CD STAGING

permissions:
  contents: write # perlu write karena workflow ini membuat & push git tag versi
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches:
      [main] # default types: opened, synchronize, reopened
      # -> ini CI gate SEBELUM merge, bukan setelah PR ditutup
  workflow_dispatch:

concurrency:
  # PR checks boleh saling cancel (perilaku CI normal),
  # tapi run menuju main HARUS antre (tidak boleh cancel-in-progress)
  # supaya tidak ada 2 run yang rebutan bikin versi/tag yang sama.
  group: ${{ github.event_name == 'pull_request' && format('fe-pr-{0}', github.event.pull_request.number) || 'fe-staging-deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_BASE: ghcr.io/ultra-teknologi-indonesia/cilupbah-frontend

jobs:
  # ─────────────────────────────────────────────
  # CI — jalan di semua trigger, tapi ini gate untuk PR.
  # Tidak melakukan docker build / push / deploy sama sekali.
  # ─────────────────────────────────────────────
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build (compile-time check)
        run: pnpm run build
        env:
          # Dummy value hanya supaya build lolos CI; nilai asli di-bake ke
          # image lewat build-arg di job `build` (lihat step "Build & Push").
          NEXT_PUBLIC_API_URL: https://ci-placeholder.invalid

  # ─────────────────────────────────────────────
  # CD — hanya jalan untuk push ke main / workflow_dispatch.
  # Auto version -> git tag -> buildx multi-tag -> push GHCR.
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      version_tag: ${{ steps.version.outputs.new_tag }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # perlu full history supaya bisa baca tag terakhir

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine Next Patch Version
        id: version
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            BASE=${LAST_TAG#v}
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      # Kumpulin semua commit sejak tag terakhir (bukan cuma HEAD) — satu
      # push bisa berisi lebih dari 1 commit.
      - name: Generate Changelog
        id: changelog
        run: |
          if [ -n "${{ steps.version.outputs.last_tag }}" ]; then
            RANGE="${{ steps.version.outputs.last_tag }}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Body multi-baris buat pesan git tag (bisa dilihat via `git show <tag>`)
          # — subject + FULL body per commit, bukan cuma subject (%s) doang.
          {
            echo "body<<CHANGELOG_EOF"
            git log "$RANGE" --pretty=format:'%h %s%n%n%b%n'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

          # Ringkasan 1-baris buat label/annotation OCI (harus 1 baris)
          {
            echo "summary<<CHANGELOG_SUMMARY_EOF"
            git log "$RANGE" --pretty=format:'%s (%h)' | paste -sd '; ' -
            echo "CHANGELOG_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      # package.json = satu-satunya sumber versi yang dibaca UI (dibaca lewat
      # FILE, bukan env var). Vercel clone shallow tanpa git tag, jadi versi
      # WAJIB ikut ke dalam tree — bump di sini lalu commit ke main. [skip ci]
      # mencegah workflow ini ter-trigger ulang; Vercel tetap rebuild commit ini
      # sehingga staging membaca versi yang benar. Image Docker (VPS) juga ikut
      # ter-bump karena build memakai working tree ini (COPY . .).
      - name: Sync package.json ke versi rilis
        run: |
          VERSION="${{ steps.version.outputs.new_tag }}"
          jq --arg v "${VERSION#v}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          if git diff --quiet -- package.json; then
            echo "package.json sudah menggunakan versi ${VERSION#v}; tidak ada commit tambahan."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(release): $VERSION [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create & Push Git Tag
        env:
          # Lewat env var, bukan interpolasi langsung ke command — commit
          # message bisa berisi tanda kutip/karakter shell lain yang bisa
          # memutus command kalau di-interpolate mentah-mentah ke `run:`.
          TAG_MESSAGE: ${{ steps.changelog.outputs.body }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.new_tag }} -m "$TAG_MESSAGE"
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image (multi-tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # build-push-action default nyalain provenance attestation, yang
          # bikin image jadi OCI index (manifest list) walau cuma 1 arch —
          # itu bikin GHCR baca description dari annotation index, bukan
          # label di config image (labels di bawah jadi tidak kebaca).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://dev-backend-app.ultra-fit.id
          labels: |
            org.opencontainers.image.title=cilupbah-frontend
            org.opencontainers.image.description=${{ steps.changelog.outputs.summary }}
            org.opencontainers.image.version=${{ steps.version.outputs.new_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # GHCR baca description dari annotation di manifest, bukan dari
          # Config.Labels di atas — jadi perlu di-set terpisah di sini juga.
          annotations: |
            org.opencontainers.image.title=cilupbah-frontend
            org.opencontainers.image.description=${{ steps.changelog.outputs.summary }}
            org.opencontainers.image.version=${{ steps.version.outputs.new_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:${{ steps.version.outputs.new_tag }}
            ${{ env.IMAGE_BASE }}:sha-${{ steps.vars.outputs.short_sha }}

  deploy:
    name: Deploy Staging
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FE_STAGING_DEPLOY_SERVER }}
          username: ${{ secrets.FE_STAGING_DEPLOY_USER }}
          key: ${{ secrets.FE_STAGING_SSH_PRIVATE_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e

            cd ${{ secrets.FE_STAGING_DEPLOY_PATH }}

            # 1. Sinkronkan docker-compose.staging.yml terbaru dari repo
            git fetch origin main
            git reset --hard origin/main

            # 2. Pull image terbaru dari GHCR
            docker compose -f docker-compose.staging.yml pull

            # 3. Restart container dengan image baru
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            # 4. Cleanup image lama — sisakan HANYA yang sedang jalan (KEEP=1).
            # Ditaruh SETELAH up -d sukses; `set -e` sudah menghentikan script
            # di atas kalau deploy gagal, jadi image lama tetap utuh untuk rollback.
            # SCOPED ke repo ini saja — VPS dipakai bersama app lain (Gitea dll),
            # jadi JANGAN `prune -af` global. `docker rmi` gagal-aman untuk image
            # yang sedang dipakai container, jadi yang jalan selamat.
            # `image prune -f` (tanpa -a) cuma buang layer dangling (<none>).
            # Rollback ditangani deploy-production.yml (re-pull versi dari GHCR).
            docker images "${{ env.IMAGE_BASE }}" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':<none>$' | xargs -r -n1 docker rmi 2>/dev/null || true
            docker image prune -f

            echo "Deployment Success"
